<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Last Word | Professor L</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/debate.css" />
</head>
<body class="debate-start-body magic-home">
  <main class="magic-home-shell" aria-labelledby="gameTitle">
    <header class="magic-nav">
      <a class="debate-wordmark" href="index.html">THE LAST WORD</a>
      <span class="magic-signal"><i></i> LIVE DEBATE</span>
      <a class="quiet-link" href="account.html">Archive</a>
    </header>

    <section class="magic-hero">
      <div class="magic-crest" aria-hidden="true">✦</div>
      <div class="magic-kicker">Professor L · Five rounds · One question</div>
      <h1 id="gameTitle">THE LAST<br><span>WORD</span></h1>
      <p class="magic-tagline">Bring the question you cannot settle.</p>

      <form class="magic-entry" id="openingChatForm" novalidate>
        <div class="magic-question-row">
          <img src="assets/portraits/professor-l.png" alt="Professor L" />
          <div>
            <strong>Professor L</strong>
            <span>What do you want to put on the table?</span>
          </div>
        </div>

        <label class="sr-only" for="openingQuestion">Your question</label>
        <textarea id="openingQuestion" class="magic-question" rows="3" maxlength="1600" placeholder="Ask your question…" required></textarea>

        <fieldset class="magic-stance">
          <legend>Where are you leaning?</legend>
          <div class="stance-options stance-chips">
            <label><input type="radio" name="stance" value="mostly-agree"><span>Agree</span></label>
            <label><input type="radio" name="stance" value="mostly-disagree"><span>Disagree</span></label>
            <label><input type="radio" name="stance" value="unsure" checked><span>Unsure</span></label>
            <label><input type="radio" name="stance" value="both-sides"><span>Both sides</span></label>
            <label><input type="radio" name="stance" value="explain"><span>My own view</span></label>
          </div>
        </fieldset>

        <div class="stance-detail-wrap" id="stanceDetailWrap" hidden>
          <label for="stanceDetail">Your starting point</label>
          <textarea id="stanceDetail" rows="2" maxlength="900" placeholder="Say where you're coming from…"></textarea>
        </div>

        <div class="magic-entry-actions">
          <button class="magic-enter" id="startConversationBtn" type="submit">TAKE A SEAT <span>→</span></button>
          <button class="magic-resume" id="loadGameBtn" type="button">Resume</button>
        </div>
        <div class="start-status" id="saveStatus" aria-live="polite"></div>
      </form>

      <a class="magic-ideas" href="topics.html">Need a question? Explore ideas →</a>
    </section>

    <footer class="magic-footer"><span>05 ROUNDS</span><span>AI JUDGED REASONING</span><span>CLARITY OVER WINNING</span></footer>
  </main>

  <script src="js/env.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
