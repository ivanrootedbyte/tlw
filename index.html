<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Last Word | Star Trial</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/arcade.css" />
</head>
<body class="title-page-body">
  <main class="title-screen-page" aria-labelledby="gameTitle">
    <section class="title-cabinet" aria-label="The Last Word title screen">
      <img class="title-art" src="assets/ui/home-title-screen.png" alt="The Last Word retro game title screen with Professor L" />

      <div class="title-hotspots" aria-hidden="false">
        <button class="title-icon-btn title-settings" type="button" id="settingsBtn" aria-label="Settings">⚙</button>
        <button class="title-icon-btn title-sound" type="button" id="soundBtn" aria-label="Toggle sound">▮▮</button>

        <h1 id="gameTitle" class="sr-only">The Last Word</h1>

        <button class="title-hit title-new-game" type="button" id="newGameBtn">
          <span>New Game</span>
        </button>
        <button class="title-hit title-load-game" type="button" id="loadGameBtn">
          <span>Load Game</span>
        </button>
        <a class="title-hit title-account" href="account.html">
          <span>Account</span>
        </a>

        <p class="title-status" id="saveStatus">Checking saved game...</p>
      </div>
    </section>

    <section class="title-help-panel" id="settingsPanel" hidden>
      <h2>How it plays</h2>
      <p>Pick a question, choose a persona, answer Professor L, and try to reach 10 stars.</p>
      <p>Load Game resumes an unfinished Star Trial saved in this browser.</p>
    </section>
  </main>

  <script src="js/env.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
