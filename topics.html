<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics | The Last Word</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/arcade.css" />
</head>
<body>
  <main class="screen arcade-screen">
    <header class="topbar arcade-topbar">
      <div class="brand">THE LAST WORD<small>TOPIC SELECT</small></div>
      <nav class="nav">
        <a href="index.html">Personas</a>
        <a href="account.html">Archive</a>
      </nav>
    </header>

    <section class="panel arcade-panel topic-hero">
      <div>
        <div class="kicker">Current player</div>
        <div id="selectedPersonaBox"></div>
      </div>
      <div class="daily-card mini-cabinet">
        <div class="kicker">Daily argument</div>
        <h3 id="dailyTitle"></h3>
        <p id="dailySummary" class="small"></p>
        <button class="btn primary" id="playDailyBtn" type="button">Play Today</button>
      </div>
    </section>

    <section class="panel arcade-panel topic-selector-shell">
      <div class="topic-sidebar">
        <div class="kicker">Categories</div>
        <div id="categoryTabs" class="category-tabs"></div>
      </div>
      <div class="topic-main">
        <div class="topic-main-head">
          <div>
            <div class="kicker">140 current debate prompts</div>
            <h2>Choose a topic</h2>
            <p class="small">Plain-language debates across tech, culture, relationships, work, society, health, and meaning.</p>
          </div>
          <input id="topicSearch" class="search-input" type="search" placeholder="Search topics..." />
        </div>
        <div id="topicGrid" class="topic-list"></div>
      </div>
      <aside class="topic-preview arcade-monitor">
        <div class="monitor-glow"></div>
        <div class="kicker">Selected topic</div>
        <h3 id="previewTitle">Pick a topic</h3>
        <p id="previewSummary">The setup will appear here.</p>
        <div class="preview-art">?</div>
        <button class="btn primary" id="previewPlayBtn" type="button" disabled>Enter Round 1</button>
      </aside>
    </section>
  </main>
  <script src="js/env.js"></script>
  <script type="module" src="js/topics.js"></script>
</body>
</html>
